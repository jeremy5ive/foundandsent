name: Backfill Thumbnails

on:
  workflow_dispatch:
    # Manual trigger only — go to the Actions tab, pick this workflow, click "Run workflow".
    # Safe to re-run any time (e.g. after adding cards by hand) — it skips files
    # that already have a thumbnail.

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate thumbnails for the existing archive
        run: python3 backfill_thumbnails.py

      - name: Commit and push
        run: |
          git config user.name "Found & Sent Bot"
          git config user.email "bot@foundandsent.net"
          git add images/thumbs/
          if git diff --cached --quiet; then
            echo "No new thumbnails to commit."
          else
            git commit -m "Backfill thumbnails for existing archive"
            git push
          fi
